spring:
  application:
    name: moiltae
  profiles:
    active: oracle
    include:
      - private
      - aws
      - mail
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  web:
    resources:
      static-locations: file:uploads/
  mvc:
    static-path-pattern: /uploads/**
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8889}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  metrics:
    tags:
      application: back

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:43200}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://kh-evre.shop}

room:
  close-interval-ms: ${ROOM_CLOSE_INTERVAL_MS:60000}
