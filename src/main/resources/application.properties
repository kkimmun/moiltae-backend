spring.application.name=moiltae
spring.profiles.active=oracle
spring.profiles.include=private,aws,mail

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.jackson.time-zone=Asia/Seoul
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/**
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=${SERVER_PORT:8889}

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=back

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:43200}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://kh-evre.shop}
room.close-interval-ms=${ROOM_CLOSE_INTERVAL_MS:60000}
