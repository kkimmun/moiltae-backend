spring.config.activate.on-profile=mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

email.verification.smtp-enabled=${MAIL_ENABLED:false}
email.verification.from=${MAIL_FROM:${MAIL_USERNAME:}}
email.verification.code-expiration-seconds=${EMAIL_CODE_EXPIRATION_SECONDS:300}
email.verification.token-expiration-seconds=${EMAIL_TOKEN_EXPIRATION_SECONDS:900}
email.verification.resend-cooldown-seconds=${EMAIL_RESEND_COOLDOWN_SECONDS:60}
