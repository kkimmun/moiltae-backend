spring:
  config:
    activate:
      on-profile: mail
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

email:
  verification:
    smtp-enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-expiration-seconds: ${EMAIL_CODE_EXPIRATION_SECONDS:300}
    token-expiration-seconds: ${EMAIL_TOKEN_EXPIRATION_SECONDS:900}
    resend-cooldown-seconds: ${EMAIL_RESEND_COOLDOWN_SECONDS:60}
