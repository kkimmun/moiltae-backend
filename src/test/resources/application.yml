spring:
  datasource:
    url: jdbc:h2:mem:moiltae;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  task:
    scheduling:
      enabled: false

jwt:
  secret: bW9pbHRhZS10ZXN0LXNlY3JldC1rZXktbXVzdC1iZS1sb25nLWVub3VnaA==
  expiration-seconds: 3600

cors:
  allowed-origins: http://localhost:5173

room:
  close-interval-ms: 60000
