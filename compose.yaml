services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moiltae
      MYSQL_USER: moiltae
      MYSQL_PASSWORD: ${DB_PASSWORD:-moiltae-local-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-moiltae-root-password}
      TZ: Asia/Seoul
    volumes:
      - moiltae-db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-moiltae-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/moiltae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: moiltae
      DB_PASSWORD: ${DB_PASSWORD:-moiltae-local-password}
      JWT_SECRET: ${JWT_SECRET:-bW9pbHRhZS1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LTIwMjY=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DDL_AUTO: ${DDL_AUTO:-update}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TZ: Asia/Seoul
    ports:
      - "${SERVER_PORT:-8889}:8889"
    mem_limit: 768m
    restart: unless-stopped

volumes:
  moiltae-db-data:
